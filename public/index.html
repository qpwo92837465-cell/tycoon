<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>City Life - ZEP Style Metaverse Tycoon</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="auth-modal" class="modal-backdrop">
    <div class="modal-box">
      <h2 class="title-logo">🏫 ZEP CITY LIFE</h2>
      <div class="input-group"><input type="text" id="auth-username" placeholder="아이디"></div>
      <div class="input-group"><input type="password" id="auth-password" placeholder="비밀번호"></div>
      
      <!-- 이메일 및 인증번호 입력 칸 (처음엔 숨김) -->
      <div class="input-group" id="email-group" style="display:none;"><input type="email" id="auth-email" placeholder="이메일 주소"></div>
      <div class="input-group" id="code-group" style="display:none; display:flex; gap:5px;">
        <input type="text" id="auth-code" placeholder="인증코드 6자리" style="flex:1;">
        <button class="btn warning" style="width:auto; padding:0 12px;" onclick="sendEmailCode()">전송</button>
      </div>

      <div class="auth-buttons" style="display:flex; flex-direction:column; gap:8px;">
        <button id="btn-login" class="btn primary">로그인</button>
        <button id="btn-show-register" class="btn secondary" onclick="toggleRegisterMode()">회원가입</button>
        <button id="btn-register" class="btn success hidden" onclick="handleRegister()">가입 완료하기</button>
      </div>
    </div>
  </div>

  <div id="game-app" class="hidden">
    <header class="hud-header">
      <div class="user-info"><strong id="hud-username">게스트</strong></div>
      <div class="teleport-nav-bar">
        <button class="btn-tp" onclick="teleportTo(1500, 1500)">🏠 중앙광장</button>
        <button class="btn-tp" onclick="teleportTo(580, 700)">🏪 편의점</button>
        <button class="btn-tp" onclick="teleportTo(2380, 700)">🎣 낚시터</button>
        <button class="btn-tp" onclick="teleportTo(1400, 2200)">⚡ 상점</button>
        <button class="btn-tp" onclick="openBuildingModal('casino')" style="background:#f59e0b;">🎰 VIP 카지노</button>
        <button class="btn-tp" onclick="openBuildingModal('stock')" style="background:#10b981;">📈 주식시장</button>
      </div>
      <div class="stats-container">
        <div class="stat-card">자산 <span class="stat-value text-green" id="hud-money">₩0</span></div>
        <div class="stat-card">직업 <span class="stat-value" id="hud-job">무직</span></div>
        <div class="stat-card hunger-card">포만감
          <div class="progress-bar"><div id="hud-hunger-bar" class="progress-fill"></div></div>
          <span id="hud-hunger-val" class="sub-text">100 / 100</span>
        </div>
      </div>
    </header>

    <div class="game-layout">
      <div class="canvas-container">
        <canvas id="world-canvas" width="980" height="650"></canvas>
        <div id="interaction-popup" class="hidden">⌨️ **[E]** 키를 눌러 상호작용하기</div>
        <div class="controls-guide">🕹️ 이동: 방향키/WASD | 상단 버튼으로 즉시 이동 | [ESC] 설정</div>
      </div>

      <div class="side-panel">
        <nav class="tab-nav">
          <button class="tab-btn active" data-tab="tab-job">💼 직업</button>
          <button class="tab-btn" data-tab="tab-inventory">🎒 가방</button>
        </nav>
        <div class="panel-content">
          <div id="tab-job" class="tab-panel active">
            <h3>💼 커리어 및 승진</h3>
            <button class="btn huge primary" style="margin-bottom:15px;" onclick="socket.emit('action:promote')">⬆️ 다음 직급 승진</button>
            <div id="job-list" class="sub-list"></div>
          </div>
          <div id="tab-inventory" class="tab-panel">
            <h3>내 인벤토리</h3>
            <div id="inventory-list" class="sub-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="building-modal" class="modal-backdrop hidden">
    <div class="modal-box large">
      <h2 id="modal-title">건물 이름</h2>
      <div id="modal-body" class="modal-body-content">내용</div>
      <button class="btn secondary" style="margin-top:15px;" onclick="closeModal()">닫기</button>
    </div>
  </div>

  <div id="esc-settings-modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <h2>⚙️ 게임 설정</h2>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
        <button class="btn warning" onclick="handleLogout()">🚪 로그아웃</button>
        <button class="btn secondary" onclick="closeEscMenu()">돌아가기</button>
      </div>
    </div>
  </div>

  <div id="toast-box" class="toast-container"></div>
  <script src="client.js"></script>
</body>
</html>
